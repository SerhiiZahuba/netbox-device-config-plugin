
{% block content %}

<div class="row mb-3">
    <div class="col-md-8">
        <h2>Config: {{ object.name }}</h2>
    </div>

    <div class="col-md-4 text-end">
        <a href="/plugins/device-config/device/{{ object.id }}/diff/"
           class="btn btn-warning btn-sm">
            Show last diff
        </a>

        <a href="/plugins/device-config/device/{{ object.id }}/show/"
           class="btn btn-primary btn-sm">
            Show current config
        </a>
    </div>
</div>

<div class="card">
    <div class="card-header"><strong>Git config storage</strong></div>

    <div class="card-body">

        <p class="text-muted">
            Configurations are stored in Git repository.
        </p>

        <div class="alert alert-info">
            Device config file:
            <strong>{{ object.name }}.cfg</strong>
        </div>

    </div>
</div>

{% endblock %}
