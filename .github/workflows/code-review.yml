name: Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - 'pyproject.toml'
      - 'setup.py'
  pull_request_review:
    types: [submitted]

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit safety
      
      - name: Run Flake8 (PEP 8 compliance)
        continue-on-error: true
        run: |
          flake8 netbox_device_config --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 netbox_device_config --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run Bandit (Security checks)
        continue-on-error: true
        run: |
          bandit -r netbox_device_config -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            echo "### 🔐 Security Scan Results" >> $GITHUB_STEP_SUMMARY
            python -c "import json; data=json.load(open('bandit-report.json')); print(f\"Found {len(data['results'])} potential security issues\")" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Check for hardcoded secrets
        continue-on-error: true
        run: |
          echo "Checking for potential secrets..."
          grep -r -n -i "password\s*=\s*['\"]" netbox_device_config --include="*.py" || echo "No hardcoded passwords found"
          grep -r -n -i "api_key\s*=\s*['\"]" netbox_device_config --include="*.py" || echo "No hardcoded API keys found"
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comment = '## 🤖 Автоматична перевірка коду\n\n';
            comment += '### ✅ Перевірки виконані:\n\n';
            comment += '- ✓ PEP 8 compliance (Flake8)\n';
            comment += '- ✓ Security scan (Bandit)\n';
            comment += '- ✓ Hardcoded secrets check\n\n';
            
            // Add security report if available
            if (fs.existsSync('bandit-report.json')) {
              const banditData = JSON.parse(fs.readFileSync('bandit-report.json', 'utf8'));
              if (banditData.results && banditData.results.length > 0) {
                comment += '### 🔐 Результати перевірки безпеки:\n\n';
                comment += `Знайдено потенційних проблем безпеки: ${banditData.results.length}\n\n`;
                
                // Show top 5 issues
                const topIssues = banditData.results.slice(0, 5);
                topIssues.forEach((issue, idx) => {
                  comment += `${idx + 1}. **${issue.test_id}**: ${issue.issue_text}\n`;
                  comment += `   - Файл: \`${issue.filename}\` (рядок ${issue.line_number})\n`;
                  comment += `   - Серйозність: ${issue.issue_severity}\n\n`;
                });
                
                if (banditData.results.length > 5) {
                  comment += `... та ще ${banditData.results.length - 5} проблем.\n\n`;
                }
              } else {
                comment += '### ✅ Проблем безпеки не знайдено!\n\n';
              }
            }
            
            comment += '\n---\n';
            comment += '*Цей коментар згенеровано автоматично агентом перевірки коду*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-reports
          path: |
            bandit-report.json
          retention-days: 30
